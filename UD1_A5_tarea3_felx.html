<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Float</title>
    <style>
        body {
            background-image: url('imagenes/fondomarmol.jpg');
            margin: 0;
            padding: 20px;
        }

        ul {
            list-style-type: none;
            margin: 0 auto;
            padding: 0;
            width: 774px;
            overflow: hidden;
        }

        li {
            float: left;
            border: 1px solid #000;
        }

        li img {
            display: block;
            width: 60px;
            height: 300px;
            object-fit: cover;
            transition: width 0.4s ease;
        }

        li img:hover {
            width: 400px;
        }
    </style>
</head>
<body>
    <ul>
        <li><img src="imagenes/img1.jpg" alt="Imagen 1"></li>
        <li><img src="imagenes/img2.jpg" alt="Imagen 2"></li>
        <li><img src="imagenes/img3.jpg" alt="Imagen 3"></li>
        <li><img src="imagenes/img4.jpg" alt="Imagen 4"></li>
        <li><img src="imagenes/img5.jpg" alt="Imagen 5"></li>
        <li><img src="imagenes/img6.jpg" alt="Imagen 6"></li>
        <li><img src="imagenes/img7.jpg" alt="Imagen 7"></li>
    </ul>
</body>
</html>
